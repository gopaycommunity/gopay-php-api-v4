image: php:8.1-cli

definitions:
  caches:
    composer: ~/.composer/cache

  steps:
    - step: &install
        name: Install
        caches:
          - composer
        script:
          - apt-get update -qq && apt-get install -y -qq git zip unzip libzip-dev && docker-php-ext-install zip
          - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          - php -r "copy('https://composer.github.io/installer.sig', 'composer-setup.sig');"
          - php -r "if (trim(file_get_contents('composer-setup.sig')) !== hash_file('sha384', 'composer-setup.php')) { fwrite(STDERR, 'Invalid Composer installer checksum'.PHP_EOL); exit(1); }"
          - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          - rm -f composer-setup.php composer-setup.sig
          - composer install --no-interaction --prefer-dist
        artifacts:
          - vendor/**

    - step: &cs
        name: Code Style (php-cs-fixer)
        script:
          - vendor/bin/php-cs-fixer check --diff --ansi --allow-risky=yes

    - step: &phpstan
        name: Static Analysis (PHPStan)
        script:
          - vendor/bin/phpstan analyse --memory-limit=512M

    - step: &test
        name: Unit Tests (PHPUnit)
        runs-on: &dev-2x
          - self.hosted
          - linux
          - gopay.dev.2x
        script:
          - apt-get update -qq && apt-get install -y -qq $PHPIZE_DEPS && pecl install pcov && docker-php-ext-enable pcov
          - vendor/bin/phpunit --testsuite Unit --colors=always --coverage-clover=coverage.xml
        artifacts:
          - coverage.xml

    - step: &e2e
        name: E2E Tests (PHPUnit)
        runs-on: *dev-2x
        script:
          - vendor/bin/phpunit --testsuite E2E --colors=always

    - step: &audit
        name: Security Audit
        script:
          - composer audit || echo "⚠️ audit found advisories (warn-only — does not block merge; resolved via /pr-status)"

    - step: &sonar
        name: Analyze on SonarCloud
        size: 2x
        services:
          - docker2x
        clone:
          depth: full
        script:
          - pipe: sonarsource/sonarcloud-scan:4.1.0
            variables:
              SONAR_SCANNER_OPTS: -Xmx2560m
              EXTRA_ARGS: -Dsonar.projectKey=gp-gopay_gopay-php-api-v4
                -Dsonar.organization=gp-gopay
                -Dsonar.sources=src
                -Dsonar.exclusions=src/Generated/**
                -Dsonar.tests=tests
                -Dsonar.php.coverage.reportPaths=coverage.xml
          - pipe: sonarsource/sonarcloud-quality-gate:0.2.0

    - step: &release-preview
        name: Release Preview (dry-run)
        clone:
          depth: full
        script:
          - apt-get update -qq && apt-get install -y -qq git curl
          - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          - apt-get install -y -qq nodejs
          # The preset is pinned: from 10.x it needs conventional-changelog-writer 9, while
          # release-notes-generator 14 still brings writer 8, so on Node 22+ (where npm stops
          # falling back to 9.x) release notes would fail with "Missing helper". Same in Release.
          - npx -p semantic-release -p @semantic-release/commit-analyzer -p @semantic-release/release-notes-generator -p @semantic-release/changelog -p @semantic-release/exec -p @semantic-release/git -p conventional-changelog-conventionalcommits@9.3.1 semantic-release --dry-run --no-ci

    - step: &release
        name: Release
        deployment: production
        clone:
          depth: full
        script:
          - apt-get update -qq && apt-get install -y -qq git curl
          - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          - apt-get install -y -qq nodejs
          - git remote set-url origin https://gopay-release-bot:$BITBUCKET_BOT_PUSH_TOKEN@bitbucket.org/$BITBUCKET_REPO_FULL_NAME.git
          - npx -p semantic-release -p @semantic-release/commit-analyzer -p @semantic-release/release-notes-generator -p @semantic-release/changelog -p @semantic-release/exec -p @semantic-release/git -p conventional-changelog-conventionalcommits@9.3.1 semantic-release
        artifacts:
          - CHANGELOG.md

    - step: &github-sync
        name: Mirror to GitHub
        clone:
          depth: full
        script:
          # php:8.1-cli ships neither git nor an ssh client; ssh is needed for the deploy-key push below.
          - apt-get update -qq && apt-get install -y -qq git openssh-client
          # Fetch master + tags after semantic-release has pushed its release commit and tag.
          - git fetch origin master --tags
          # Authenticates with the repository SSH key from Pipelines settings (deploy key on the GitHub mirror).
          - git remote add github git@github.com:gopaycommunity/gopay-php-api-v4.git
          - git push github refs/remotes/origin/master:refs/heads/master --force
          - git push github --tags

  services:
    docker2x:
      type: docker
      memory: 4096

pipelines:
  pull-requests:
    '**':
      - step: *install
      - parallel:
          - step: *cs
          - step: *phpstan
          - step: *test
          - step: *e2e
      - step: *audit
      - step: *sonar
      - step: *release-preview

  branches:
    master:
      - step: *install
      - parallel:
          - step: *cs
          - step: *phpstan
          - step: *test
          - step: *e2e
      - step: *audit
      - step: *sonar
      - step: *release
      - step: *github-sync
