image: php:8.1-cli

definitions:
  caches:
    composer: ~/.composer/cache

  steps:
    - step: &install
        name: Install
        caches:
          - composer
        script:
          - apt-get update -qq && apt-get install -y -qq git zip unzip libzip-dev && docker-php-ext-install zip
          - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          - php -r "copy('https://composer.github.io/installer.sig', 'composer-setup.sig');"
          - php -r "if (trim(file_get_contents('composer-setup.sig')) !== hash_file('sha384', 'composer-setup.php')) { fwrite(STDERR, 'Invalid Composer installer checksum'.PHP_EOL); exit(1); }"
          - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          - rm -f composer-setup.php composer-setup.sig
          - composer install --no-interaction --prefer-dist
        artifacts:
          - vendor/**

    - step: &cs
        name: Code Style (php-cs-fixer)
        script:
          - vendor/bin/php-cs-fixer check --diff --ansi --allow-risky=yes

    - step: &phpstan
        name: Static Analysis (PHPStan)
        script:
          - vendor/bin/phpstan analyse --memory-limit=512M

    - step: &test
        name: Unit Tests (PHPUnit)
        script:
          - apt-get update -qq && apt-get install -y -qq $PHPIZE_DEPS && pecl install pcov && docker-php-ext-enable pcov
          - vendor/bin/phpunit --colors=always --coverage-clover=coverage.xml
        artifacts:
          - coverage.xml

    - step: &audit
        name: Security Audit
        script:
          - composer audit || echo "⚠️ audit found advisories (warn-only — does not block merge; resolved via /pr-status)"

    - step: &sonar
        name: Analyze on SonarCloud
        size: 2x
        services:
          - docker2x
        clone:
          depth: full
        script:
          - pipe: sonarsource/sonarcloud-scan:4.1.0
            variables:
              SONAR_SCANNER_OPTS: -Xmx2560m
              EXTRA_ARGS: -Dsonar.projectKey=gp-gopay_gopay-php-api-v4
                -Dsonar.organization=gp-gopay
                -Dsonar.sources=src
                -Dsonar.exclusions=src/Generated/**
                -Dsonar.tests=tests
                -Dsonar.php.coverage.reportPaths=coverage.xml
          - pipe: sonarsource/sonarcloud-quality-gate:0.2.0

    - step: &release-preview
        name: Release Preview (dry-run)
        clone:
          depth: full
        script:
          - apt-get update -qq && apt-get install -y -qq git nodejs npm
          - npx -p semantic-release -p @semantic-release/commit-analyzer -p @semantic-release/release-notes-generator -p @semantic-release/changelog -p @semantic-release/exec -p @semantic-release/git semantic-release --dry-run --no-ci

    - step: &release
        name: Release
        deployment: production
        clone:
          depth: full
        script:
          - apt-get update -qq && apt-get install -y -qq git nodejs npm
          - git remote set-url origin https://gopay-release-bot:$BITBUCKET_BOT_PUSH_TOKEN@bitbucket.org/$BITBUCKET_REPO_FULL_NAME.git
          - npx -p semantic-release -p @semantic-release/commit-analyzer -p @semantic-release/release-notes-generator -p @semantic-release/changelog -p @semantic-release/exec -p @semantic-release/git semantic-release
        artifacts:
          - CHANGELOG.md

  services:
    docker2x:
      type: docker
      memory: 4096

pipelines:
  pull-requests:
    '**':
      - step: *install
      - parallel:
          - step: *cs
          - step: *phpstan
          - step: *test
      - step: *audit
      - step: *sonar
      - step: *release-preview

  branches:
    master:
      - step: *install
      - parallel:
          - step: *cs
          - step: *phpstan
          - step: *test
      - step: *audit
      - step: *sonar
      - step: *release
